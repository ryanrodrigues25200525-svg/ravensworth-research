name: Refresh portfolio marks

on:
  schedule:
    - cron: "30 21 * * 1-5" # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_portfolio.py
      - name: Commit refreshed marks
        run: |
          git config user.name "claude-research-bot"
          git config user.email "actions@github.com"
          git add portfolio.md data/equity_curve.csv
          git diff --staged --quiet || git commit -m "chore: refresh portfolio marks"
          git push
